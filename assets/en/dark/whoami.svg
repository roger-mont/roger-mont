<svg xmlns="http://www.w3.org/2000/svg" width="960" height="366" viewBox="0 0 960 366" role="img" aria-label="whoami"><title>whoami</title><style>text{font-family:ui-monospace,'SF Mono','Cascadia Code','JetBrains Mono',Consolas,'DejaVu Sans Mono',monospace}</style><rect x="0.5" y="0.5" width="959" height="365" rx="10" fill="#0d1117" stroke="#30363d"/><rect x="0.5" y="0.5" width="959" height="38" rx="10" fill="#010409" stroke="#30363d"/><rect x="1" y="28" width="958" height="10" fill="#010409"/><line x1="0.5" y1="38.5" x2="959.5" y2="38.5" stroke="#30363d"/><circle cx="22" cy="19" r="6" fill="#ff5f57"/><circle cx="42" cy="19" r="6" fill="#febc2e"/><circle cx="62" cy="19" r="6" fill="#28c840"/><text x="480.0" y="24" font-size="13" fill="#7d8590" text-anchor="middle">roger@bench: ~</text><text x="28" y="62" font-size="15" opacity="0" xml:space="preserve"><tspan fill="#3fb950">❯ </tspan><tspan fill="#e6edf3">cat roger.yaml</tspan><animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="0.35s" fill="freeze"/></text><text x="28" y="88" font-size="15" opacity="0" xml:space="preserve"><tspan fill="#e3a046">name</tspan><tspan fill="#7d8590">: </tspan><tspan fill="#39d0c8">Roger Monteiro</tspan><animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="0.67s" fill="freeze"/></text><text x="28" y="114" font-size="15" opacity="0" xml:space="preserve"><tspan fill="#e3a046">based_in</tspan><tspan fill="#7d8590">: </tspan><tspan fill="#39d0c8">Manaus, Brazil</tspan><animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="0.99s" fill="freeze"/></text><text x="28" y="140" font-size="15" opacity="0" xml:space="preserve"><tspan fill="#e3a046">does</tspan><tspan fill="#7d8590">: </tspan><tspan fill="#39d0c8">full stack · hardware ↔ software</tspan><animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="1.31s" fill="freeze"/></text><text x="28" y="166" font-size="15" opacity="0" xml:space="preserve"><tspan fill="#e3a046">starts_at</tspan><tspan fill="#7d8590">: </tspan><tspan fill="#39d0c8">the bench</tspan><tspan fill="#7d8590">  # soldering, multimeter, LCR meter, ESP32</tspan><animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="1.63s" fill="freeze"/></text><text x="28" y="192" font-size="15" opacity="0" xml:space="preserve"><tspan fill="#e3a046">ends_at</tspan><tspan fill="#7d8590">: </tspan><tspan fill="#39d0c8">production</tspan><tspan fill="#7d8590">  # Docker, CI/CD, automatic rollback</tspan><animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="1.95s" fill="freeze"/></text><text x="28" y="218" font-size="15" opacity="0" xml:space="preserve"><tspan fill="#e3a046">now</tspan><tspan fill="#7d8590">:</tspan><animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="2.27s" fill="freeze"/></text><text x="28" y="244" font-size="15" opacity="0" xml:space="preserve"><tspan fill="#7d8590">  - </tspan><tspan fill="#e6edf3">Heimdall: chat, recorded calls and an MCP server</tspan><animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="2.59s" fill="freeze"/></text><text x="28" y="270" font-size="15" opacity="0" xml:space="preserve"><tspan fill="#7d8590">  - </tspan><tspan fill="#e6edf3">smart bed: weight estimation from an FSR matrix</tspan><animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="2.91s" fill="freeze"/></text><text x="28" y="296" font-size="15" opacity="0" xml:space="preserve"><tspan fill="#e3a046">after_hours</tspan><tspan fill="#7d8590">: </tspan><tspan fill="#39d0c8">homelab with Umbrel and Tailscale</tspan><animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="3.23s" fill="freeze"/></text><text x="28" y="322" font-size="15" opacity="0" xml:space="preserve"><tspan fill="#3fb950">❯ </tspan><tspan fill="#e6edf3"></tspan><tspan fill="#e3a046">▌<animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></tspan><animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="3.55s" fill="freeze"/